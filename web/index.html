<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Match Predictions</title>
    <script>
        {
          const t = localStorage.getItem('ups_theme');
          document.documentElement.dataset.bsTheme = t === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (t || 'dark');
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<header class="border-bottom px-3 py-3 d-flex justify-content-between align-items-center">
    <h1 class="h5 fw-bold mb-0">Match Predictions</h1>
    <button id="theme-toggle" class="btn btn-sm btn-outline-secondary" aria-label="Toggle theme"></button>
</header>
<main id="main" class="container-xl px-3 py-4">
    <div id="grid" class="matches-grid"></div>
    <div class="mt-4 pt-3 border-top">
        <a href="privacy.html" class="text-secondary small">Privacy Policy</a>
    </div>
</main>
<div id="submit-all-container" class="d-none submit-bar">
    <div class="container-xl px-3 d-flex justify-content-between align-items-center">
        <button id="save-image-btn" class="btn btn-secondary btn-sm">Save as image</button>
        <button id="submit-all-btn" class="btn btn-danger">
            Submit Predictions (<span id="submit-all-count">0</span>)
        </button>
    </div>
</div>
<div id="name-modal" class="nm-overlay d-none">
    <div class="nm-box">
        <h2 class="h6 fw-bold mb-1">Who are you?</h2>
        <p class="text-secondary small mb-3">Enter a name to save your prediction.</p>
        <p id="modal-error" class="text-danger small d-none mb-2"></p>
        <input type="text" id="name-input" class="form-control mb-3"
               placeholder="Your name" autocomplete="off">
        <div class="d-flex gap-2 justify-content-end">
            <button id="modal-cancel" class="btn btn-secondary btn-sm">Cancel</button>
            <button id="modal-submit" class="btn btn-danger btn-sm">Submit</button>
        </div>
        <p class="text-secondary text-center mb-0 mt-2" style="font-size:.7rem">By submitting you allow us
            to <a href="privacy.html"
                  target="_blank"
                  class="text-secondary">store cookies</a></p>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
