<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PULOW</title>
    <meta name="description" content="Predictions für die Uniliga Overwatch"/>

    <!-- Open Graph (Discord reads these) -->
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://pulow.cc"/>
    <meta property="og:title" content="PULOW"/>
    <meta property="og:description" content="Predictions für die Uniliga Overwatch"/>
    <meta property="og:site_name" content="PULOW"/>

    <!-- Twitter Card (Discord favors these over OG for image display) -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:url" content="https://pulow.cc"/>
    <meta name="twitter:title" content="PULOW"/>
    <meta name="twitter:description" content="Predictions für die Uniliga Overwatch"/>

    <!-- Discord embed accent border color -->
    <meta name="theme-color" content="#F3900E"/>
    <script>
        {
          const t = localStorage.getItem('ups_theme');
          document.documentElement.dataset.bsTheme = t === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : (t || 'dark');
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<header class="border-bottom px-3 py-3 d-flex justify-content-between align-items-center">
    <h1 class="h5 fw-bold mb-0"><a href="/" class="text-decoration-none text-body">Prediction für die Uniliga
        Overwatch</a> <span class="beta-badge">BETA</span></h1>
    <div class="d-flex align-items-center gap-2">
        <a href="https://github.com/Not-Nik/ups" target="_blank" rel="noopener" class="text-secondary lh-1"
           aria-label="GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"
                 aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
        <button id="theme-toggle" class="btn btn-sm btn-outline-secondary" aria-label="Toggle theme"></button>
    </div>
</header>
<main id="main" class="container-xl px-3 py-4">
    <div id="grid" class="matches-grid"></div>
    <div class="mt-4 pt-3 border-top">
        <a href="privacy.html" class="text-secondary small">Privacy Policy</a>
    </div>
</main>
<div id="submit-all-container" class="d-none submit-bar">
    <div class="container-xl px-3 d-flex justify-content-between align-items-center">
        <button id="save-image-btn" class="btn btn-secondary btn-sm">Save as image</button>
        <button id="submit-all-btn" class="btn btn-danger">
            Submit Predictions (<span id="submit-all-count">0</span>)
        </button>
    </div>
</div>
<div id="name-modal" class="nm-overlay d-none">
    <div class="nm-box">
        <h2 class="h6 fw-bold mb-1">Who are you?</h2>
        <p class="text-secondary small mb-3">Enter a name to save your prediction.</p>
        <p id="modal-error" class="text-danger small d-none mb-2"></p>
        <input type="text" id="name-input" class="form-control mb-3"
               placeholder="Your name" autocomplete="off">
        <div class="d-flex gap-2 justify-content-end">
            <button id="modal-cancel" class="btn btn-secondary btn-sm">Cancel</button>
            <button id="modal-submit" class="btn btn-danger btn-sm">Submit</button>
        </div>
        <p class="text-secondary text-center mb-0 mt-2" style="font-size:.7rem">By submitting you allow us
            to <a href="privacy.html"
                  target="_blank"
                  class="text-secondary">store cookies</a></p>
    </div>
</div>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
